name: Build and Release Desktop Apps

on:
  push:
    tags:
      - 'v*_*' # Matches tags like v1.0.0_snake, v1.0.0_sudoku, v1.0.0_diep

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_flag: --linux
          - os: windows-latest
            platform_flag: --win
          - os: macos-latest
            platform_flag: --mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Game Name from Tag
        id: extract_game
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          GAME_NAME="${TAG_NAME##*_}"
          echo "game=$GAME_NAME" >> $GITHUB_OUTPUT
          echo "Building game: $GAME_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        env:
          TARGET_GAME: ${{ steps.extract_game.outputs.game }}
        run: npx ng build --configuration production

      - name: Package with Electron Builder
        env:
          TARGET_GAME: ${{ steps.extract_game.outputs.game }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.platform_flag }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: release/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-artifacts/*.exe
            all-artifacts/*.dmg
            all-artifacts/*.AppImage
            all-artifacts/*.zip
            all-artifacts/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}