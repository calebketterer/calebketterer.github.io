<div class="snake-shell">
  <!-- HUD Top Header -->
  <div class="hud-header">
    <div class="hud-title">SERPENT</div>
    <div class="hud-score">
      <span class="hud-label">SCORE:</span>
      <span class="hud-val">{{ score }}</span>
    </div>
  </div>

  <!-- Main Viewport (Fixed Size Container) -->
  <div class="viewport-box" (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)">
    <app-snake-title-screen
      *ngIf="gameState === 'TITLE'"
      (ready)="onTitleReady()"
    ></app-snake-title-screen>

    <app-snake-menu-screen
      *ngIf="gameState === 'MENU'"
      [difficulties]="engine.difficulties"
      [selectedDifficulty]="engine.selectedDifficulty"
      [availableBoardSizes]="engine.availableBoardSizes"
      [currentBoardSize]="engine.boardSize"
      [highScores]="highScores"
      (selectDifficultyLevel)="onSelectDifficultyLevel($event)"
      (selectBoardSize)="onSelectBoardSize($event)"
      (startGame)="onStartGame()"
    ></app-snake-menu-screen>

    <!-- Canvas Playfield -->
    <canvas
      #gameCanvas
      width="360"
      height="360"
      [class.hidden]="gameState === 'TITLE' || gameState === 'MENU'"
    ></canvas>

    <!-- Countdown Overlay -->
    <div class="overlay countdown-overlay" *ngIf="gameState === 'COUNTDOWN'">
      <div class="countdown-num">{{ countdown }}</div>
    </div>

    <!-- Game Over Overlay -->
    <div class="overlay" *ngIf="gameState === 'GAMEOVER'">
      <div class="overlay-card">
        <h3 class="over-title">GAME OVER</h3>
        <p class="over-desc">TRY AGAIN?</p>
        <div class="final-score">SCORE: {{ score }}</div>
        <button class="action-btn" (click)="onStartGame()">RETRY</button>
        <button class="action-btn secondary" (click)="engine.setGameState('MENU')">MENU</button>
      </div>
    </div>

    <!-- Pause Overlay -->
    <div class="overlay" *ngIf="gameState === 'PAUSED'">
      <div class="overlay-card">
        <h3 class="over-title">PAUSED</h3>
        <button class="action-btn" (click)="engine.pauseGame()">RESUME</button>
      </div>
    </div>
  </div>

  <!-- Mobile Touch Controls -->
  <div class="dpad-controls" *ngIf="gameState === 'PLAYING' || gameState === 'COUNTDOWN'">
    <button class="dpad-btn up" (click)="onMove('UP')">▲</button>
    <div class="dpad-mid">
      <button class="dpad-btn left" (click)="onMove('LEFT')">◀</button>
      <button class="dpad-btn down" (click)="onMove('DOWN')">▼</button>
      <button class="dpad-btn right" (click)="onMove('RIGHT')">▶</button>
    </div>
  </div>
</div>
