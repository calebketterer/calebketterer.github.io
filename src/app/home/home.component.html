<app-background-engine #bgEngine></app-background-engine>

<div class="home-container">
  <header class="hero-banner">
    <div class="banner-top-row">
      <div class="hero-badge">STATION_INTERFACE v2.0</div>

      <div class="controls-wrapper">
        <div class="engine-controls">
          <span class="control-label">SIM_SPEED</span>
          <button class="glass-ctrl-btn" [class.active]="isPlaying" (click)="toggleEngine()">
            {{ isPlaying ? 'PAUSE ❚❚' : 'PLAY ▶' }}
          </button>
          <button class="glass-ctrl-btn" [class.active]="currentSpeed === 1" (click)="setSpeed(1)">1x</button>
          <button class="glass-ctrl-btn" [class.active]="currentSpeed === 2" (click)="setSpeed(2)">2x ></button>
          <button class="glass-ctrl-btn" [class.active]="currentSpeed === 4" (click)="setSpeed(4)">4x >></button>
        </div>

        <div class="engine-controls particle-cap-controls">
          <span class="control-label">PARTICLE_CAP</span>
          <span class="particle-counter">{{ activeParticleCount }} / {{ maxParticles }}</span>
          <button 
            class="glass-ctrl-btn hold-btn" 
            (mousedown)="startHoldAdjust(-10)" 
            (mouseup)="stopHoldAdjust()" 
            (mouseleave)="stopHoldAdjust()"
            (touchstart)="startHoldAdjust(-10); $event.preventDefault()" 
            (touchend)="stopHoldAdjust()">-</button>
          <button 
            class="glass-ctrl-btn hold-btn" 
            (mousedown)="startHoldAdjust(10)" 
            (mouseup)="stopHoldAdjust()" 
            (mouseleave)="stopHoldAdjust()"
            (touchstart)="startHoldAdjust(10); $event.preventDefault()" 
            (touchend)="stopHoldAdjust()">+</button>
        </div>
      </div>
    </div>

    <h1 class="hero-title">CENTRAL COMMAND</h1>
    <p class="hero-desc">
      Sci-fi tactical interface housing interactive game engines, experimental canvas subsystems, and project documentation archives.
    </p>
  </header>

  <app-resource-links></app-resource-links>
</div>
