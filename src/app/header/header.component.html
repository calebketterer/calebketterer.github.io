<div class="header-container">
    <!-- Left Slot for Back Button -->
    <div class="header-slot left-slot">
        <button 
            *ngIf="showBackButton" 
            (click)="goHome()" 
            class="back-button" 
            aria-label="Back to home">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M 2 12 L 9 5 L 9 9.5 L 22 9.5 L 22 14.5 L 9 14.5 L 9 19 Z" />
            </svg>
        </button>
    </div>

    <!-- Centered Canvas Animated Header -->
    <div class="canvas-header-wrapper" (click)="onHeaderClick()">
        <canvas #titleCanvas class="title-canvas"></canvas>
    </div>

    <!-- Right Slot for Layout Balance -->
    <div class="header-slot right-slot"></div>
</div>
